<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <img src="assets/logo.jpeg" alt="Indo-Japan Martial Arts Academy" class="logo-img">
      <h1>Indo-Japan Martial Arts Academy</h1>
      <p>Sign in to continue.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email"
               placeholder="Enter email" required>
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password"
               placeholder="Enter password" required>
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <div *ngIf="error" class="error-message">
        <mat-icon>error</mat-icon>
        {{ error }}
      </div>

      <div *ngIf="resetMessage" class="success-message">
        <mat-icon>check_circle</mat-icon>
        {{ resetMessage }}
      </div>

      <button mat-raised-button color="primary" type="submit" class="full-width login-btn"
              [disabled]="loading || !email || !password">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">Sign In</span>
      </button>

      <div class="forgot-password">
        <a (click)="forgotPassword()" class="forgot-link">Forgot Password?</a>
      </div>
    </form>
  </div>
</div>
