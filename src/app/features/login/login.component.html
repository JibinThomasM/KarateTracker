<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <img src="assets/logo.jpeg" alt="Indo-Japan Martial Arts Academy" class="logo-img">
      <h1>Indo-Japan Martial Arts Academy</h1>
      <p *ngIf="isFirstTime">Welcome! Set up your admin password to get started.</p>
      <p *ngIf="!isFirstTime">Enter your password to continue.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password"
               placeholder="Enter password" required>
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <mat-form-field *ngIf="isFirstTime" appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
               placeholder="Confirm password" required>
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <div *ngIf="error" class="error-message">
        <mat-icon>error</mat-icon>
        {{ error }}
      </div>

      <button mat-raised-button color="primary" type="submit" class="full-width login-btn"
              [disabled]="loading || !password">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">{{ isFirstTime ? 'Set Password & Enter' : 'Login' }}</span>
      </button>
    </form>
  </div>
</div>
